name: Windows Pytest

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest on Windows
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      LIGHTHOUSE_USE_OLLAMA: "0"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run pytest
        shell: pwsh
        run: |
          python -m pytest tests -ra
